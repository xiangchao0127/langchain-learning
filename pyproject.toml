[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-file-agent"
version = "0.1.0"
description = "基于 LangChain 1.x / LangGraph 的半结构化文件解析与 Apache Doris 入库智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "langchain-learning" }]
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-community>=0.4,<0.5",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "PyMySQL>=1.1",
    "PyYAML>=6.0",
    "chardet>=5.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
file-agent = "file_agent.cli:main"

[tool.setuptools.packages.find]
include = ["file_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
